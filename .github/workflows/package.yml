name: Package Extension

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Package and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd poe2-trade-extension
          npm install

      - name: Build extension
        run: |
          cd poe2-trade-extension
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            npm run build:prod
          else
            npm run build
          fi

      - name: Create ZIP archive
        run: |
          cd poe2-trade-extension/dist
          zip -r ../../poe2-trade-extension.zip ./*
          cd ../..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: poe2-trade-extension
          path: poe2-trade-extension.zip
          if-no-files-found: error

      - name: Create Official Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: poe2-trade-extension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Dev Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        uses: softprops/action-gh-release@v1
        with:
          files: poe2-trade-extension.zip
          tag_name: dev
          name: Development Build
          body: |
            🚧 **开发版本 (Development Build)**
            
            这是最新的开发版本，自动从 `main` 分支构建。
            
            - 📅 构建时间: ${{ github.event.head_commit.timestamp }}
            - 📝 提交信息: ${{ github.event.head_commit.message }}
            - 👤 提交者: ${{ github.event.head_commit.author.name }}
            - 🔗 提交 SHA: ${{ github.sha }}
            
            ⚠️ 此版本可能不稳定，仅供测试使用。
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
